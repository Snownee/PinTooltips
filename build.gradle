plugins {
    id 'net.neoforged.moddev' version '2.0.78'
    id "me.modmuss50.mod-publish-plugin" version "2.+"
    id 'eclipse'
    id "com.diffplug.eclipse.apt" version "4.1.0"
}

group = "snownee.pintooltips"
version = "${minecraft_version}-NeoForge-${mod_version}"
var realVersion = project.mod_version + '+neoforge'
archivesBaseName = project.archives_base_name

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

neoForge {
    // We currently only support NeoForge versions later than 21.0.x
    // See https://projects.neoforged.net/neoforged/neoforge for the latest updates
    version = "21.1.219"

    // Validate AT files and raise errors when they have invalid targets
    // This option is false by default, but turning it on is recommended
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        data {
            data()
        }
    }

    mods {
        testproject {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"

        content {
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        url "https://maven.su5ed.dev/releases"
    }

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

dependencies {
//    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
//    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
//    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")

    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:0.107.0+2.0.23+1.21.1"

    runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:15.0.140"

//    runtimeOnly fg.deobf("maven.modrinth:prism-lib:1.0.5-forge")
//    runtimeOnly fg.deobf("maven.modrinth:iceberg:1.1.25-forge")
//    runtimeOnly fg.deobf("maven.modrinth:equipment-compare:1.3.7-forge,1.20.1")
//    runtimeOnly fg.deobf("maven.modrinth:legendary-tooltips:1.4.5-forge,1.20.1")

    implementation "maven.modrinth:obscure-tooltips:4.2.2-neoforge"
    implementation "maven.modrinth:fragmentum:2.1.1-neoforge"

    implementation "maven.modrinth:jei:19.21.0.247-neoforge"
    implementation "maven.modrinth:just-enough-effect-descriptions-jeed:1.21-2.2.16-neoforge"
    implementation "maven.modrinth:jade:15.9.4+neoforge"
    implementation "maven.modrinth:kiwi:15.3.5+neoforge"
    annotationProcessor "maven.modrinth:kiwi:15.3.5+neoforge"
}

processResources {
    def properties = [
            version    : realVersion,
            id         : mod_id,
            name       : mod_name,
            description: mod_description,
            source     : "https://github.com/Snownee/PinTooltips",
            minecraft  : ">=1.21.1"
    ]
    filesMatching(["META-INF/neoforge.mods.toml", "*.mixins.json", "pack.mcmeta"]) {
        expand(properties)
    }
}

jar {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : realVersion,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

publishMods {
    file = jar.archiveFile
    changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
    type = ['release': STABLE, 'beta': BETA, 'alpha': ALPHA][release_type]
    modLoaders.add("neoforge")
    displayName = "[NeoForge ${supported_version}] ${mod_version}"
    version = realVersion

    curseforge {
        projectId = "1131483"
        client = true
        server = true
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("forgified-fabric-api")
        requires("kiwi")
        optional("jade")
        optional("more-enchantment-info")
        optional("just-enough-effect-descriptions-jeed")
    }
    modrinth {
        projectId = "fFmpgMfg"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("forgified-fabric-api")
        requires("kiwi")
        optional("jade")
        optional("more-enchantment-info")
        optional("just-enough-effect-descriptions-jeed")
    }
}