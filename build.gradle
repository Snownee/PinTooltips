plugins {
    id 'net.neoforged.moddev' version '2.0.78'
    id "me.shedaniel.unified-publishing" version "0.1.+"
    id 'eclipse'
    id "com.diffplug.eclipse.apt" version "4.1.0"
}

group = "snownee.pintooltips"
version = "${minecraft_version}-NeoForge-${mod_version}"
var realVersion = project.mod_version + '+neoforge'
archivesBaseName = project.archives_base_name

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

neoForge {
    // We currently only support NeoForge versions later than 21.0.x
    // See https://projects.neoforged.net/neoforged/neoforge for the latest updates
    version = "21.1.120"

    // Validate AT files and raise errors when they have invalid targets
    // This option is false by default, but turning it on is recommended
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        data {
            data()
        }
    }

    mods {
        testproject {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"

        content {
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        url "https://maven.su5ed.dev/releases"
    }

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

dependencies {
//    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
//    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
//    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")

    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:0.107.0+2.0.23+1.21.1"

    runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:15.0.140"

//    runtimeOnly fg.deobf("maven.modrinth:prism-lib:1.0.5-forge")
//    runtimeOnly fg.deobf("maven.modrinth:iceberg:1.1.25-forge")
//    runtimeOnly fg.deobf("maven.modrinth:equipment-compare:1.3.7-forge,1.20.1")
//    runtimeOnly fg.deobf("maven.modrinth:legendary-tooltips:1.4.5-forge,1.20.1")
    implementation "maven.modrinth:jei:19.21.0.247-neoforge"
    implementation "maven.modrinth:just-enough-effect-descriptions-jeed:1.21-2.2.16-neoforge"
    implementation "maven.modrinth:jade:15.9.4+neoforge"
    implementation "maven.modrinth:kiwi:15.3.5+neoforge"
    annotationProcessor "maven.modrinth:kiwi:15.3.5+neoforge"
}

processResources {
    def properties = [
            version    : realVersion,
            id         : mod_id,
            name       : mod_name,
            description: mod_description,
            source     : "https://github.com/Snownee/PinTooltips",
            minecraft  : ">=1.21.1"
    ]
    filesMatching(["META-INF/neoforge.mods.toml", "*.mixins.json", "pack.mcmeta"]) {
        expand(properties)
    }
}

jar {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : realVersion,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

unifiedPublishing {
    project {
        displayName = "[NeoForge $project.supported_version] $project.mod_version"
        version = realVersion // Optional, Inferred from project by default
        changelog = file("CHANGELOG.md").exists() ? file("CHANGELOG.md").text : "" // Optional, in markdown format
        releaseType = project.release_type // Optional, use "release", "beta" or "alpha"
        gameVersions = [project.minecraft_version]
        gameLoaders = ["neoforge"]

        mainPublication tasks.jar // Declares the publicated jar

        if (System.getenv("CURSE_TOKEN") != null) {
            curseforge {
                token = System.getenv("CURSE_TOKEN")
                id = "1131483"

                relations { // Optional, Inferred from the relations above by default
                    depends "forgified-fabric-api"
                    depends "kiwi"
                    optional "jade"
                    optional "more-enchantment-info"
                    optional "just-enough-effect-descriptions-jeed"
                }
            }
        }

        if (System.getenv("MODRINTH_TOKEN") != null) {
            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                id = "fFmpgMfg"

                relations { // Optional, Inferred from the relations above by default
                    depends "forgified-fabric-api"
                    depends "kiwi"
                    optional "jade"
                    optional "more-enchantment-info"
                    optional "just-enough-effect-descriptions-jeed"
                }
            }
        }
    }
}