plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

version = "mc${archive_minecraft_version}-Fabric-${mod_version}"
group = project.maven_group
var realVersion = project.mod_version + '+fabric'

base {
    archivesName = project.archives_base_name
}

// Include resources generated by data generators.
sourceSets {
    main.resources.srcDirs += "$rootDir/src/generated/resources"
}

loom {
    accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"

        content {
            includeGroup("com.terraformersmc")
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"

        content {
            includeGroup("fuzs.forgeconfigapiport")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

//    runtimeOnly("com.terraformersmc:modmenu:11.0.3")
//    api("me.shedaniel.cloth:cloth-config-fabric:15.0.140") {
//        exclude(group: "net.fabricmc.fabric-api")
//    }

//    modRuntimeOnly("maven.modrinth:legendary-tooltips:1.4.11-fabric,1.21.1")
//    modRuntimeOnly("maven.modrinth:prism-lib:1.0.9-fabric")
//    modRuntimeOnly("maven.modrinth:iceberg:1.2.9.2-fabric")
//    modRuntimeOnly("maven.modrinth:equipment-compare:1.3.12-fabric,1.21")

//    modImplementation("maven.modrinth:obscure-tooltips:4.2.2")
//    modImplementation("maven.modrinth:fragmentum:2.1.0")
//    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.6"

//    modImplementation("maven.modrinth:jei:19.21.0.247-fabric")
//    modImplementation("maven.modrinth:just-enough-effect-descriptions-jeed:1.21-2.2.15-fabric")
    implementation("maven.modrinth:jade:${jade_version}+fabric")
    implementation annotationProcessor("maven.modrinth:kiwi:${kiwi_version}+fabric")
//    implementation fileTree(dir: "libs", include: ["*.jar"])
//    annotationProcessor fileTree(dir: "libs", include: ["*.jar"])
}

processResources {
    def properties = [
            version: realVersion,
            id     : mod_id,
            name   : "Pin Tooltips",
            source : "https://github.com/Snownee/PinTooltips"
    ]
    filesMatching(["fabric.mod.json", "*.mixins.json"]) {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
    it.options.compilerArgs.add("-Akiwi.clientOnlyMod")
}

java {
//    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishMods {
    file = jar.archiveFile
    changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
    type = ['release': STABLE, 'beta': BETA, 'alpha': ALPHA][release_type]
    modLoaders.add("fabric")
    modLoaders.add("quilt")
    displayName = "[Fabric ${supported_version}] ${mod_version}"
    version = realVersion

    curseforge {
        projectId = "1131483"
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("fabric-api")
        requires("kiwi-fabric")
        optional("jade")
        optional("more-enchantment-info")
        optional("just-enough-effect-descriptions-jeed")
    }
    modrinth {
        projectId = "fFmpgMfg"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("fabric-api")
        requires("kiwi")
        optional("jade")
        optional("more-enchantment-info")
        optional("just-enough-effect-descriptions-jeed")
    }
}