plugins {
    id "fabric-loom" version "1.10-SNAPSHOT"
    id "me.modmuss50.mod-publish-plugin" version "2.+"
}

group = "snownee.pintooltips"
version = "${project.supported_version}-Fabric-${mod_version}"
var realVersion = project.mod_version + '+fabric'
archivesBaseName = project.archives_base_name

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

loom {
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }

//    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")

    runs {
        configureEach {
            property "mixin.debug.export", "true"
            property "mixin.debug.countInjection", "true"
            property "mixin.debug.verbose", "true"
            property "mixin.dumpTargetOnFailure", "true"
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"

        content {
            includeGroup("com.terraformersmc")
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"

        content {
            includeGroup("fuzs.forgeconfigapiport")
        }
    }

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

dependencies {
    minecraft("com.mojang:minecraft:1.21.1")
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.21.1:2024.11.17@zip")
    }

    modImplementation("net.fabricmc:fabric-loader:0.16.10")
    modImplementation("net.fabricmc.fabric-api:fabric-api:0.115.1+1.21.1")

    modRuntimeOnly("com.terraformersmc:modmenu:11.0.3")
    modApi("me.shedaniel.cloth:cloth-config-fabric:15.0.140") {
        exclude(group: "net.fabricmc.fabric-api")
    }

//    modRuntimeOnly("maven.modrinth:legendary-tooltips:1.4.11-fabric,1.21.1")
//    modRuntimeOnly("maven.modrinth:prism-lib:1.0.9-fabric")
//    modRuntimeOnly("maven.modrinth:iceberg:1.2.9.2-fabric")
//    modRuntimeOnly("maven.modrinth:equipment-compare:1.3.12-fabric,1.21")

    modImplementation("maven.modrinth:obscure-tooltips:4.2.2")
    modImplementation("maven.modrinth:fragmentum:2.1.0")
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.6"

    modImplementation("maven.modrinth:jei:19.21.0.247-fabric")
    modImplementation("maven.modrinth:just-enough-effect-descriptions-jeed:1.21-2.2.15-fabric")
    modImplementation("maven.modrinth:jade:15.9.3+fabric")
    modImplementation("maven.modrinth:kiwi:15.1.4+fabric")
    annotationProcessor("maven.modrinth:kiwi:15.1.4+fabric")
}

processResources {
    def properties = [
            version        : realVersion,
            id             : mod_id,
            name           : mod_name,
            mod_description: mod_description,
            source         : "https://github.com/Snownee/PinTooltips",
            minecraft      : ">=1.21.1"
    ]
    filesMatching(["fabric.mod.json", "*.mixins.json"]) {
        expand(properties)
    }
}

publishMods {
    file = remapJar.archiveFile
    changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
    type = ['release': STABLE, 'beta': BETA, 'alpha': ALPHA][release_type]
    modLoaders.add("fabric")
    modLoaders.add("quilt")
    displayName = "[Fabric ${supported_version}] ${mod_version}"
    version = realVersion

    curseforge {
        projectId = "1131483"
        client = true
        server = true
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("fabric-api")
        requires("kiwi-fabric")
        optional("jade")
        optional("more-enchantment-info")
        optional("just-enough-effect-descriptions-jeed")
    }
    modrinth {
        projectId = "fFmpgMfg"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("fabric-api")
        requires("kiwi")
        optional("jade")
        optional("more-enchantment-info")
        optional("just-enough-effect-descriptions-jeed")
    }
}