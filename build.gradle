plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
    id 'eclipse'
    id "com.diffplug.eclipse.apt" version "4.1.0"
}

group = "snownee.pintooltips"
version = "mc${minecraft_version}-NeoForge-${mod_version}"
var realVersion = project.mod_version + '+neoforge'

base {
    archivesName = project.archives_base_name
}

neoForge {
    // We currently only support NeoForge versions later than 21.0.x
    // See https://projects.neoforged.net/neoforged/neoforge for the latest updates
    version = "26.1.2.77"

    // Validate AT files and raise errors when they have invalid targets
    // This option is false by default, but turning it on is recommended
    validateAccessTransformers = true

    accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]

    runs {
        client {
            client()
        }
        data {
            clientData()
        }
    }

    mods {
        testproject {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    // JEI
    maven { url "https://modmaven.dev" }
    maven { url "https://dvs1.progwml6.com/files/maven/" }

    maven {
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"

        content {
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        url "https://maven.su5ed.dev/releases"
    }

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

dependencies {
//    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
//    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
//    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")

    runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:26.1.154"
    implementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${forgified_fabric_api_version}"

//    runtimeOnly fg.deobf("maven.modrinth:prism-lib:1.0.5-forge")
//    runtimeOnly fg.deobf("maven.modrinth:iceberg:1.1.25-forge")
//    runtimeOnly fg.deobf("maven.modrinth:equipment-compare:1.3.7-forge,1.20.1")
//    runtimeOnly fg.deobf("maven.modrinth:legendary-tooltips:1.4.5-forge,1.20.1")

    compileOnly "maven.modrinth:obscure-tooltips:4.2.2-neoforge"
    compileOnly "maven.modrinth:fragmentum:2.1.1-neoforge"

    def jei_version = "29.5.0.28"
    // compile against the JEI API but do not include it at runtime
    compileOnlyApi "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnlyApi "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "maven.modrinth:just-enough-effect-descriptions-jeed:1.21-2.2.16-neoforge"
    implementation "maven.modrinth:jade:26.1.1+neoforge"
    implementation(annotationProcessor("maven.modrinth:kiwi:26.0.7+neoforge"))
}

processResources {
    def properties = [
            version    : realVersion,
            id         : mod_id,
            name       : mod_name,
            description: mod_description,
            source     : "https://github.com/Snownee/PinTooltips",
            minecraft  : ">=1.21.1"
    ]
    filesMatching(["META-INF/neoforge.mods.toml", "*.mixins.json", "pack.mcmeta"]) {
        expand(properties)
    }
}

jar {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : realVersion,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

publishMods {
    file = jar.archiveFile
    changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
    type = ['release': STABLE, 'beta': BETA, 'alpha': ALPHA][release_type]
    modLoaders.add("neoforge")
    displayName = "[NeoForge ${supported_version}] ${mod_version}"
    version = realVersion

    curseforge {
        projectId = "1131483"
        accessToken = providers.environmentVariable("CURSE_TOKEN")
        minecraftVersions.add(minecraft_version)
        minecraftVersions.add("26.1")
        minecraftVersions.add("26.1.1")
        requires("kiwi")
        optional("jade")
        optional("more-enchantment-info")
        optional("just-enough-effect-descriptions-jeed")
    }
    modrinth {
        projectId = "fFmpgMfg"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        minecraftVersions.add("26.1")
        minecraftVersions.add("26.1.1")
        requires("kiwi")
        optional("jade")
        optional("more-enchantment-info")
        optional("just-enough-effect-descriptions-jeed")
    }
}
