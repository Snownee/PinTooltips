plugins {
    id "fabric-loom" version "1.10-SNAPSHOT"
    id "me.shedaniel.unified-publishing" version "0.1.+"
}

group = "snownee.pintooltips"
version = "${project.supported_version}-Fabric-${mod_version}"
var realVersion = project.mod_version + '+fabric'
archivesBaseName = project.archives_base_name

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

loom {
    mixin {
        defaultRefmapName = "${mod_id}.refmap.json"
    }

//    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")

    runs {
        configureEach {
            property "mixin.debug.export", "true"
            property "mixin.debug.countInjection", "true"
            property "mixin.debug.verbose", "true"
            property "mixin.dumpTargetOnFailure", "true"
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"

        content {
            includeGroup("com.terraformersmc")
            includeGroup("me.shedaniel.cloth")
        }
    }

    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

dependencies {
    minecraft("com.mojang:minecraft:1.21.1")
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.21.1:2024.11.17@zip")
    }

    modImplementation("net.fabricmc:fabric-loader:0.16.10")
    modImplementation("net.fabricmc.fabric-api:fabric-api:0.115.1+1.21.1")

    modRuntimeOnly("com.terraformersmc:modmenu:11.0.3")
    modApi("me.shedaniel.cloth:cloth-config-fabric:15.0.140") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modRuntimeOnly("maven.modrinth:prism-lib:1.0.9-fabric")
    modRuntimeOnly("maven.modrinth:iceberg:1.2.9.2-fabric")
    modRuntimeOnly("maven.modrinth:forge-config-api-port:v21.1.3-1.21.1-Fabric")
    modRuntimeOnly("maven.modrinth:equipment-compare:1.3.12-fabric,1.21")
    modRuntimeOnly("maven.modrinth:legendary-tooltips:1.4.11-fabric,1.21.1")

    modImplementation("maven.modrinth:jei:19.21.0.247-fabric")
    modImplementation("maven.modrinth:just-enough-effect-descriptions-jeed:1.21-2.2.15-fabric")
    modImplementation("maven.modrinth:jade:15.9.3+fabric")
}

processResources {
    def properties = [
            version        : realVersion,
            id             : mod_id,
            name           : mod_name,
            mod_description: mod_description,
            source         : "https://github.com/Snownee/PinTooltips",
            minecraft      : ">=1.21.1"
    ]
    filesMatching(["fabric.mod.json", "*.mixins.json"]) {
        expand(properties)
    }
}

unifiedPublishing {
    project {
        displayName = "[Fabric $project.supported_version] $project.mod_version"
        version = realVersion // Optional, Inferred from project by default
        changelog = file("CHANGELOG.md").exists() ? file("CHANGELOG.md").text : "" // Optional, in markdown format
        releaseType = project.release_type // Optional, use "release", "beta" or "alpha"
        gameVersions = [project.minecraft_version]
        gameLoaders = ["fabric", "quilt"]

        mainPublication tasks.remapJar // Declares the publicated jar

        if (System.getenv("CURSE_TOKEN") != null) {
            curseforge {
                token = System.getenv("CURSE_TOKEN")
                id = "1131483"

                relations { // Optional, Inferred from the relations above by default
                    optional "jade"
                    optional "more-enchantment-info"
                    optional "just-enough-effect-descriptions-jeed"
                }
            }
        }

        if (System.getenv("MODRINTH_TOKEN") != null) {
            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                id = "fFmpgMfg"

                relations { // Optional, Inferred from the relations above by default
                    optional "jade"
                    optional "more-enchantment-info"
                    optional "just-enough-effect-descriptions-jeed"
                }
            }
        }
    }
}